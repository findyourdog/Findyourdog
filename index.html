<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PawCare Luxury</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================
   LUXURY DARK THEME
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Inter',sans-serif;
  background: radial-gradient(circle at top, #0b0f1a, #05060a);
  color:#eaeaea;
  overflow-x:hidden;
}

/* GOLD ACCENT */
:root{
  --gold:#d4af37;
  --glass:rgba(255,255,255,0.05);
}

/* =========================
   FLOATING PAWS (ANIMATION)
========================= */

.paw{
  position:fixed;
  font-size:20px;
  opacity:0.08;
  animation:floatPaws 10s linear infinite;
  color:var(--gold);
  pointer-events:none;
}

.paw:nth-child(1){ left:10%; animation-delay:0s; }
.paw:nth-child(2){ left:30%; animation-delay:2s; }
.paw:nth-child(3){ left:50%; animation-delay:4s; }
.paw:nth-child(4){ left:70%; animation-delay:1s; }
.paw:nth-child(5){ left:90%; animation-delay:3s; }

@keyframes floatPaws{
  0%{ transform:translateY(100vh) rotate(0deg); opacity:0; }
  50%{ opacity:0.15; }
  100%{ transform:translateY(-10vh) rotate(360deg); opacity:0; }
}

/* =========================
   GLOBAL
========================= */

.container{
  width:90%;
  max-width:1200px;
  margin:auto;
}

section{
  padding:90px 0;
}

/* =========================
   HEADINGS
========================= */

.section-title{
  text-align:center;
  margin-bottom:50px;
}

.section-title h2{
  font-size:2.8rem;
  font-weight:800;
  color:#fff;
}

.section-title p{
  color:#aaa;
}

/* =========================
   BUTTON (GOLD LUXURY)
========================= */

.btn{
  display:inline-block;
  padding:14px 34px;
  background:linear-gradient(135deg,#d4af37,#b8860b);
  color:#111;
  text-decoration:none;
  border-radius:50px;
  font-weight:800;
  transition:0.3s;
  box-shadow:0 10px 30px rgba(212,175,55,0.2);
}

.btn:hover{
  transform:translateY(-4px) scale(1.03);
  box-shadow:0 15px 40px rgba(212,175,55,0.4);
}

/* =========================
   HERO
========================= */

.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  position:relative;
}

.hero-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:50px;
  align-items:center;
}

.hero h1{
  font-size:4rem;
  color:#fff;
}

.hero p{
  color:#bbb;
  margin:20px 0;
  font-size:1.1rem;
}

.hero img{
  width:100%;
  border-radius:25px;
  box-shadow:0 30px 80px rgba(0,0,0,0.6);
  border:1px solid rgba(212,175,55,0.2);
}

/* =========================
   GLOBAL PET COUNTER
========================= */

.counter{
  background:var(--glass);
  border:1px solid rgba(255,255,255,0.1);
  padding:40px;
  border-radius:20px;
  text-align:center;
  margin:40px 0;
  backdrop-filter:blur(12px);
}

.counter h3{
  font-size:3rem;
  color:var(--gold);
  letter-spacing:2px;
}

/* fake animation effect */
.counter span{
  animation:countGlow 2s infinite alternate;
}

@keyframes countGlow{
  from{ opacity:0.6; }
  to{ opacity:1; }
}

/* =========================
   CARDS (LUXURY GLASS)
========================= */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}

.card{
  background:var(--glass);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:20px;
  overflow:hidden;
  backdrop-filter:blur(12px);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-10px);
  border-color:var(--gold);
  box-shadow:0 20px 60px rgba(212,175,55,0.15);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.card-content{
  padding:22px;
  color:#ddd;
}

/* =========================
   LOGOS
========================= */

.logo{
  background:var(--glass);
  border:1px solid rgba(255,255,255,0.08);
  padding:25px;
  border-radius:18px;
  text-align:center;
  color:#ddd;
}

/* =========================
   TABLE
========================= */

.compare table{
  width:100%;
  border-collapse:collapse;
  background:var(--glass);
  backdrop-filter:blur(12px);
  border-radius:20px;
  overflow:hidden;
}

.compare th{
  background:rgba(212,175,55,0.15);
  color:var(--gold);
  padding:18px;
}

.compare td{
  padding:18px;
  text-align:center;
  border-bottom:1px solid rgba(255,255,255,0.05);
  color:#ddd;
}

/* =========================
   TIMELINE
========================= */

.step{
  background:var(--glass);
  border:1px solid rgba(255,255,255,0.08);
  padding:20px;
  border-radius:18px;
  color:#ddd;
}

/* =========================
   FOOTER
========================= */

footer{
  background:#000;
  padding:70px 0;
  color:#aaa;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:768px){
  .hero-grid{
    grid-template-columns:1fr;
    text-align:center;
  }

  .hero h1{
    font-size:2.6rem;
  }
}

</style>
</head>

<body>

<!-- 🐾 FLOATING PAWS -->
<div class="paw">🐾</div>
<div class="paw">🐾</div>
<div class="paw">🐾</div>
<div class="paw">🐾</div>
<div class="paw">🐾</div>

<!-- HERO -->
<section class="hero">
<div class="container hero-grid">

<div>
<h1>Luxury Puppy Care 🐶</h1>
<p>Premium guide for elite dog lovers. Care, training, nutrition & lifestyle for your companion.</p>

<a href="#breeds" class="btn">Explore World Breeds</a>

<!-- 🌍 GLOBAL COUNTER -->
<div class="counter">
<h3><span>900,000,000+</span></h3>
<p>Dogs currently living worldwide</p>
</div>

</div>

<div>
<img src="https://cdn.shopify.com/s/files/1/0813/7945/9311/files/095daeabbae4f1be3802a0fdf61945c7.jpg?v=1779910194">
</div>

</div>
</section>

<!-- TRUST -->
<section>
<div class="container">
<div class="section-title">
<h2>Trusted Worldwide</h2>
<p>Luxury dog care community</p>
</div>

<div class="cards">
<div class="logo">Elite Owners</div>
<div class="logo">Premium Breeds</div>
<div class="logo">Vet Approved</div>
<div class="logo">Global Reach</div>
</div>

</div>
</section>

</body>
</html>
