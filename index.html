<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puppy Match Experience</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:radial-gradient(circle at top,#fff7ec,#ffe4e6,#fff);
color:#222;
overflow-x:hidden;
}

/* HERO */
.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:radial-gradient(circle at top,#ff6b6b22,#fff);
position:relative;
}

.hero h1{
font-size:3.5rem;
font-weight:800;
}

.hero p{
color:#666;
margin-top:15px;
max-width:600px;
margin:auto;
}

.cta{
margin-top:25px;
display:inline-block;
padding:15px 35px;
background:#ff6b6b;
color:white;
border-radius:50px;
text-decoration:none;
font-weight:600;
transition:.3s;
}

.cta:hover{
transform:scale(1.05);
}

/* QUIZ */
.quiz-section{
padding:120px 10%;
}

.quiz{
max-width:850px;
margin:auto;
background:white;
border-radius:30px;
padding:50px;
box-shadow:0 25px 60px rgba(0,0,0,0.08);
text-align:center;
position:relative;
overflow:hidden;
}

.quiz::before{
content:"🐶";
position:absolute;
font-size:220px;
opacity:0.04;
top:-40px;
right:-40px;
}

.quiz-header h2{
font-size:2.2rem;
margin-bottom:10px;
}

.quiz-header p{
color:#777;
margin-bottom:30px;
}

.progress{
height:10px;
background:#eee;
border-radius:20px;
overflow:hidden;
margin-bottom:35px;
}

.progress-bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#ff6b6b,#ffb6b6);
transition:.4s;
}

.question{
font-size:1.6rem;
margin-bottom:25px;
animation:fade .3s ease;
}

.options{
display:flex;
flex-direction:column;
gap:12px;
}

.options button{
padding:15px 20px;
border:none;
border-radius:50px;
background:#f5f5f5;
cursor:pointer;
font-weight:500;
transition:.3s;
}

.options button:hover{
background:#ff6b6b;
color:white;
transform:scale(1.03);
}

@keyframes fade{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

/* RESULT */
.result{
animation:fade .6s ease;
text-align:center;
}

.dogs{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-top:25px;
}

.dog{
background:#fff7f7;
padding:20px;
border-radius:20px;
transition:.3s;
}

.dog:hover{
transform:translateY(-5px);
}

.dog img{
width:100%;
height:170px;
object-fit:cover;
border-radius:15px;
margin-bottom:10px;
}

footer{
text-align:center;
padding:40px;
color:#888;
}

/* MOBILE */
@media(max-width:768px){
.hero h1{font-size:2.3rem;}
.quiz{padding:30px;}
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
<div>
<h1>🐶 Find Your Puppy Match</h1>
<p>A luxury interactive quiz that discovers your perfect furry companion based on your lifestyle & personality.</p>
<a href="#quiz" class="cta">Start Quiz</a>
</div>
</div>

<!-- QUIZ -->
<section id="quiz" class="quiz-section">
<div class="quiz">

<div class="quiz-header">
<h2>🐾 Puppy Personality Quiz</h2>
<p>Answer a few cute questions to find your match</p>
</div>

<div class="progress">
<div class="progress-bar" id="bar"></div>
</div>

<div id="quizBox">
<div class="question" id="question">Loading...</div>
<div class="options" id="options"></div>
</div>

</div>
</section>

<footer>© Puppy Match Experience</footer>

<script>

const quiz = [
{
q:"What is your energy level?",
a:[
{text:"🐾 Calm & cozy",type:"calm"},
{text:"✨ Balanced",type:"balanced"},
{text:"⚡ Very active",type:"active"}
]
},
{
q:"Your perfect weekend?",
a:[
{text:"Home & movies 🛋️",type:"calm"},
{text:"Coffee & friends ☕",type:"balanced"},
{text:"Outdoor adventure 🌲",type:"active"}
]
},
{
q:"Ideal dog personality?",
a:[
{text:"Small & calm 🐶",type:"calm"},
{text:"Friendly & smart 🧠",type:"balanced"},
{text:"Energetic & playful 🎾",type:"active"}
]
},
{
q:"Training time you can give?",
a:[
{text:"Very little ⏳",type:"calm"},
{text:"Some time 🕒",type:"balanced"},
{text:"A lot ❤️",type:"active"}
]
}
];

let i = 0;
let score = {calm:0,balanced:0,active:0};

function load(){
if(i >= quiz.length){
show();
return;
}

document.getElementById("question").innerText = quiz[i].q;

let opt = document.getElementById("options");
opt.innerHTML = "";

quiz[i].a.forEach(o=>{
let b = document.createElement("button");

b.innerText = o.text;

b.onclick = ()=>{
score[o.type]++;
i++;

document.getElementById("bar").style.width = ((i/quiz.length)*100)+"%";

document.getElementById("quizBox").style.opacity = 0;

setTimeout(()=>{
document.getElementById("quizBox").style.opacity = 1;
load();
},200);
};

opt.appendChild(b);
});
}

function show(){

let best = Object.keys(score).reduce((a,b)=>score[a]>score[b]?a:b);

const dogs = {
calm:[
{n:"Pug",img:"https://images.unsplash.com/photo-1517423440428-a5a00ad493e8?auto=format&fit=crop&w=800&q=80"},
{n:"Bulldog",img:"https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=800&q=80"},
{n:"Shih Tzu",img:"https://images.unsplash.com/photo-1591769225440-811ad7d6eab3?auto=format&fit=crop&w=800&q=80"}
],
balanced:[
{n:"Golden Retriever",img:"https://images.unsplash.com/photo-1558788353-f76d92427f16?auto=format&fit=crop&w=800&q=80"},
{n:"Labrador",img:"https://images.unsplash.com/photo-1598133894008-61f7fdb8cc3a?auto=format&fit=crop&w=800&q=80"},
{n:"Beagle",img:"https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=800&q=80"}
],
active:[
{n:"Husky",img:"https://images.unsplash.com/photo-1605568427561-40dd23c2acea?auto=format&fit=crop&w=800&q=80"},
{n:"Border Collie",img:"https://images.unsplash.com/photo-1598133894008-61f7fdb8cc3a?auto=format&fit=crop&w=800&q=80"},
{n:"German Shepherd",img:"https://images.unsplash.com/photo-1601758125946-6ec2ef64daf8?auto=format&fit=crop&w=800&q=80"}
];

document.querySelector(".quiz").innerHTML = `
<div class="result">
<h2>🐶 Your Puppy Match is Ready</h2>
<p>You match with <b>${best.toUpperCase()}</b> personality</p>

<div class="dogs">
${dogs[best].map(d=>`
<div class="dog">
<img src="${d.img}">
<h3>${d.n}</h3>
<p>Perfect companion for you</p>
</div>
`).join("")}
</div>

<br><br>
<button class="cta" onclick="location.reload()">Try Again</button>
</div>
`;
}

load();

</script>

</body>
</html>
