<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PawMatch - Find Your Dog</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url("https://cdn.shopify.com/s/files/1/0813/7945/9311/files/4.jpg?v=1779911626") no-repeat center center fixed;
  background-size: cover;
  color: #2b2b2b;
}

.container {
  max-width: 600px;
  margin: 40px auto;
  background: rgba(248,245,240,0.95);
  padding: 20px;
  border-radius: 20px;
}

.section { display: none; text-align: center; }
.section.active { display: block; }

.hero-img {
  width: 100%;
  border-radius: 15px;
  margin-bottom: 10px;
}

button {
  padding: 12px 18px;
  margin: 10px;
  border: none;
  border-radius: 12px;
  background: #b08968;
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover { transform: scale(1.05); }

.card {
  background: white;
  padding: 20px;
  border-radius: 15px;
  margin-top: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.card img {
  width: 100%;
  border-radius: 15px;
  margin-bottom: 10px;
}

.progress {
  font-weight: bold;
  margin-bottom: 15px;
}
</style>
</head>

<body>

<div class="container">

  <!-- HERO -->
  <section id="hero" class="section active">
    <img class="hero-img" src="https://cdn.shopify.com/s/files/1/0813/7945/9311/files/wallpaper_dogs.jpg?v=1779910780">
    <h1>Find Your Perfect Dog 🐶</h1>
    <p>Take a short quiz and discover your ideal furry companion.</p>
    <button onclick="startQuiz()">Start Quiz</button>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="section">
    <div class="progress" id="progress"></div>
    <div id="question-box"></div>

    <div>
      <button onclick="prevQuestion()">Back</button>
      <button onclick="nextQuestion()">Next</button>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="section">
    <h2>Your Perfect Match 🐾</h2>
    <div id="result-box"></div>
    <button onclick="restartQuiz()">Try Again</button>
  </section>

</div>

<script>
const questions = [
  {
    q: "What is your lifestyle?",
    options: [
      { text: "Very active 🏃", score: { collie: 2, retriever: 1 } },
      { text: "Balanced ⚖️", score: { retriever: 2, french: 1 } },
      { text: "Relaxed 🛋️", score: { french: 2, shiba: 1 } }
    ]
  },
  {
    q: "Where do you live?",
    options: [
      { text: "Small apartment", score: { french: 2, shiba: 1 } },
      { text: "House with yard", score: { retriever: 2 } },
      { text: "Large space", score: { collie: 2 } }
    ]
  },
  {
    q: "Free time daily?",
    options: [
      { text: "1–2 hours", score: { french: 2 } },
      { text: "3–5 hours", score: { retriever: 2, shiba: 1 } },
      { text: "Whole day", score: { collie: 2 } }
    ]
  },
  {
    q: "Your personality?",
    options: [
      { text: "Energetic & playful", score: { collie: 2, retriever: 1 } },
      { text: "Calm & loyal", score: { retriever: 2, french: 1 } },
      { text: "Independent", score: { shiba: 2 } }
    ]
  },
  {
    q: "Dog experience?",
    options: [
      { text: "First-time owner", score: { retriever: 2, french: 1 } },
      { text: "Some experience", score: { shiba: 1, retriever: 1 } },
      { text: "Very experienced", score: { collie: 2 } }
    ]
  }
];

let current = 0;
let answers = [];

const box = document.getElementById("question-box");
const progress = document.getElementById("progress");

const dogs = {
  retriever: {
    name: "Golden Retriever 🐶",
    desc: "Friendly, loyal and perfect for active families.",
    img: "https://cdn.shopify.com/s/files/1/0813/7945/9311/files/095daeabbae4f1be3802a0fdf61945c7.jpg?v=1779910194"
  },
  french: {
    name: "French Bulldog 🐶",
    desc: "Calm, cute and perfect for apartment life.",
    img: "https://cdn.shopify.com/s/files/1/0813/7945/9311/files/Black_and_white_french_bulldog_sitting_attentively_canine_animal.jpg?v=1779910869"
  },
  collie: {
    name: "Border Collie 🐶",
    desc: "Super intelligent and extremely active.",
    img: "https://cdn.shopify.com/s/files/1/0813/7945/9311/files/Red_bordercollie.jpg?v=1779910927"
  },
  shiba: {
    name: "Shiba Inu 🐶",
    desc: "Independent, strong personality and smart.",
    img: "https://cdn.shopify.com/s/files/1/0813/7945/9311/files/3.jpg?v=1779911250"
  }
};

function startQuiz() {
  document.getElementById("hero").classList.remove("active");
  document.getElementById("quiz").classList.add("active");
  showQuestion();
}

function showQuestion() {
  let q = questions[current];
  progress.innerText = `Step ${current + 1} of ${questions.length}`;

  box.innerHTML = `
    <div class="card">
      <h3>${q.q}</h3>
      ${q.options.map((opt, i) => `
        <label>
          <input type="radio" name="answer" value="${i}">
          ${opt.text}
        </label><br/>
      `).join("")}
    </div>
  `;
}

function nextQuestion() {
  const selected = document.querySelector('input[name="answer"]:checked');
  if (!selected) return;

  answers[current] = parseInt(selected.value);

  if (current < questions.length - 1) {
    current++;
    showQuestion();
  } else {
    showResult();
  }
}

function prevQuestion() {
  if (current > 0) {
    current--;
    showQuestion();
  }
}

function calculateResult() {
  let score = { retriever: 0, french: 0, collie: 0, shiba: 0 };

  answers.forEach((ans, qIndex) => {
    let option = questions[qIndex].options[ans];
    for (let dog in option.score) {
      score[dog] += option.score[dog];
    }
  });

  let best = Object.keys(score).reduce((a, b) =>
    score[a] > score[b] ? a : b
  );

  return dogs[best];
}

function showResult() {
  document.getElementById("quiz").classList.remove("active");
  document.getElementById("result").classList.add("active");

  let dog = calculateResult();

  document.getElementById("result-box").innerHTML = `
    <div class="card">
      <img src="${dog.img}">
      <h3>${dog.name}</h3>
      <p>${dog.desc}</p>
    </div>
  `;
}

function restartQuiz() {
  current = 0;
  answers = [];

  document.getElementById("result").classList.remove("active");
  document.getElementById("hero").classList.add("active");
}
</script>

</body>
</html>
