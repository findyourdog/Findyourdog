<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dream Dog Builder</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url("https://cdn.shopify.com/s/files/1/0813/7945/9311/files/4.jpg?v=1779911626") no-repeat center center fixed;
  background-size: cover;
}

.container {
  max-width: 650px;
  margin: 40px auto;
  background: rgba(255,255,255,0.95);
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

/* STEPS */
.step {
  display: none;
  animation: fade 0.4s ease;
}

.step.active {
  display: block;
}

@keyframes fade {
  from {opacity: 0; transform: translateY(10px);}
  to {opacity: 1; transform: translateY(0);}
}

/* TITLE */
h1 {
  font-size: 1.8rem;
  margin-bottom: 10px;
}

/* OPTIONS */
.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 20px;
}

.option {
  padding: 15px;
  border-radius: 14px;
  border: 2px solid #eee;
  cursor: pointer;
  transition: 0.2s;
  background: white;
  font-weight: bold;
}

.option:hover {
  transform: scale(1.03);
  border-color: #b08968;
}

.option.selected {
  background: #b08968;
  color: white;
  border-color: #b08968;
}

/* BUTTONS */
button {
  padding: 12px 18px;
  margin: 10px;
  border: none;
  border-radius: 12px;
  background: #b08968;
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

/* RESULT CARD */
.result {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-top: 20px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}

.result img {
  width: 100%;
  height: 320px;
  object-fit: cover;
  border-radius: 15px;
  margin-bottom: 15px;
  animation: pop 0.4s ease;
}

@keyframes pop {
  from {transform: scale(0.9); opacity: 0;}
  to {transform: scale(1); opacity: 1;}
}

.progress {
  font-weight: bold;
  margin-bottom: 10px;
}

.bar {
  height: 8px;
  background: #eee;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 20px;
}

.fill {
  height: 100%;
  width: 0%;
  background: #b08968;
  transition: 0.3s;
}
</style>
</head>

<body>

<div class="container">

  <!-- STEP 1 -->
  <div class="step active">
    <h1>What size dog do you want? 🐶</h1>
    <div class="options">
      <div class="option" data-key="size" data-value="small">Small</div>
      <div class="option" data-key="size" data-value="medium">Medium</div>
      <div class="option" data-key="size" data-value="large">Large</div>
    </div>
  </div>

  <!-- STEP 2 -->
  <div class="step">
    <h1>Energy level ⚡</h1>
    <div class="options">
      <div class="option" data-key="energy" data-value="low">Low</div>
      <div class="option" data-key="energy" data-value="high">High</div>
    </div>
  </div>

  <!-- STEP 3 -->
  <div class="step">
    <h1>Personality 🧠</h1>
    <div class="options">
      <div class="option" data-key="personality" data-value="calm">Calm</div>
      <div class="option" data-key="personality" data-value="playful">Playful</div>
      <div class="option" data-key="personality" data-value="independent">Independent</div>
    </div>
  </div>

  <!-- STEP 4 -->
  <div class="step">
    <h1>Living space 🏡</h1>
    <div class="options">
      <div class="option" data-key="home" data-value="apartment">Apartment</div>
      <div class="option" data-key="home" data-value="house">House</div>
    </div>
  </div>

  <!-- RESULT -->
  <div class="step">
    <h1>Your Dream Dog 🐶</h1>
    <div id="result"></div>
    <button onclick="restart()">Try Again</button>
  </div>

  <button onclick="next()">Next</button>

</div>

<script>

let currentStep = 0;
let selections = {};

const steps = document.querySelectorAll(".step");

const dogs = [
  {
    name: "Golden Retriever",
    img: "https://cdn.shopify.com/s/files/1/0813/7945/9311/files/095daeabbae4f1be3802a0fdf61945c7.jpg?v=1779910194",
    match: { size:"large", energy:"high", personality:"playful" }
  },
  {
    name: "French Bulldog",
    img: "https://cdn.shopify.com/s/files/1/0813/7945/9311/files/Black_and_white_french_bulldog_sitting_attentively_canine_animal.jpg?v=1779910869",
    match: { size:"small", energy:"low", personality:"calm" }
  },
  {
    name: "Border Collie",
    img: "https://cdn.shopify.com/s/files/1/0813/7945/9311/files/Red_bordercollie.jpg?v=1779910927",
    match: { size:"medium", energy:"high", personality:"playful" }
  },
  {
    name: "Shiba Inu",
    img: "https://cdn.shopify.com/s/files/1/0813/7945/9311/files/3.jpg?v=1779911250",
    match: { size:"small", energy:"low", personality:"independent" }
  }
];

document.querySelectorAll(".option").forEach(el => {
  el.addEventListener("click", () => {

    // remove selected in same group
    document.querySelectorAll(`[data-key="${el.dataset.key}"]`)
      .forEach(x => x.classList.remove("selected"));

    el.classList.add("selected");
    selections[el.dataset.key] = el.dataset.value;

  });
});

function next() {
  if (currentStep < steps.length - 1) {
    steps[currentStep].classList.remove("active");
    currentStep++;
    steps[currentStep].classList.add("active");
  }

  if (currentStep === steps.length - 1) {
    showResult();
  }
}

function showResult() {
  let best = dogs[0];
  let bestScore = -1;

  dogs.forEach(dog => {
    let score = 0;

    for (let key in selections) {
      if (dog.match[key] === selections[key]) score++;
    }

    if (score > bestScore) {
      bestScore = score;
      best = dog;
    }
  });

  document.getElementById("result").innerHTML = `
    <div class="result">
      <img src="${best.img}">
      <h2>${best.name}</h2>
      <p>Perfect match based on your lifestyle 🐾</p>
    </div>
  `;

  steps[currentStep].classList.remove("active");
  steps[currentStep + 1].classList.add("active");
}

function restart() {
  location.reload();
}

</script>

</body>
</html>
