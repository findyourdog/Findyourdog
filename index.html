<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dog Match Builder</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url("https://cdn.shopify.com/s/files/1/0813/7945/9311/files/4.jpg?v=1779911626") no-repeat center center fixed;
  background-size: cover;
}

/* CONTAINER */
.container {
  max-width: 700px;
  margin: 40px auto;
  background: rgba(255,255,255,0.95);
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

/* SCREENS */
.screen {
  display: none;
  animation: fade 0.4s ease;
}

.screen.active {
  display: block;
}

@keyframes fade {
  from {opacity: 0; transform: translateY(10px);}
  to {opacity: 1; transform: translateY(0);}
}

/* BUTTON */
button {
  padding: 12px 18px;
  border: none;
  border-radius: 12px;
  background: #b08968;
  color: white;
  cursor: pointer;
  transition: 0.3s;
  margin-top: 15px;
}

button:hover {
  transform: scale(1.05);
}

/* OPTIONS */
.options {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 15px;
}

.option {
  padding: 12px 16px;
  border-radius: 12px;
  border: 2px solid #eee;
  cursor: pointer;
  transition: 0.2s;
  background: white;
}

.option:hover {
  transform: scale(1.05);
}

.option.active {
  background: #b08968;
  color: white;
  border-color: #b08968;
}

/* RESULT CARD */
.card {
  margin-top: 20px;
  background: white;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 10px 20px rgba(0,0,0,0.1);
  animation: pop 0.4s ease;
}

.card img {
  width: 100%;
  height: 320px;
  object-fit: cover;
}

@keyframes pop {
  from {transform: scale(0.9); opacity: 0;}
  to {transform: scale(1); opacity: 1;}
}
</style>
</head>

<body>

<div class="container">

<!-- INTRO SCREEN -->
<div class="screen active" id="intro">
  <h1>🐶 Find Your Perfect Dog</h1>
  <p>Answer a few quick choices and discover your ideal match in seconds.</p>
  <button onclick="start()">Start</button>
</div>

<!-- BUILDER SCREEN -->
<div class="screen" id="builder">

  <h2>Build your dog 🧠</h2>

  <div class="section">
    <h3>Size</h3>
    <div class="options" data-type="size">
      <div class="option" data-value="small">Small</div>
      <div class="option" data-value="medium">Medium</div>
      <div class="option" data-value="large">Large</div>
    </div>
  </div>

  <div class="section">
    <h3>Energy</h3>
    <div class="options" data-type="energy">
      <div class="option" data-value="low">Low</div>
      <div class="option" data-value="high">High</div>
    </div>
  </div>

  <div class="section">
    <h3>Personality</h3>
    <div class="options" data-type="personality">
      <div class="option" data-value="calm">Calm</div>
      <div class="option" data-value="playful">Playful</div>
      <div class="option" data-value="independent">Independent</div>
    </div>
  </div>

  <div id="result"></div>

</div>

</div>

<script>

let state = {
  size: null,
  energy: null,
  personality: null
};

const dogs = [
  {
    name: "Golden Retriever",
    img: "https://cdn.shopify.com/s/files/1/0813/7945/9311/files/095daeabbae4f1be3802a0fdf61945c7.jpg?v=1779910194",
    match: { size:"large", energy:"high", personality:"playful" }
  },
  {
    name: "French Bulldog",
    img: "https://cdn.shopify.com/s/files/1/0813/7945/9311/files/Black_and_white_french_bulldog_sitting_attentively_canine_animal.jpg?v=1779910869",
    match: { size:"small", energy:"low", personality:"calm" }
  },
  {
    name: "Border Collie",
    img: "https://cdn.shopify.com/s/files/1/0813/7945/9311/files/Red_bordercollie.jpg?v=1779910927",
    match: { size:"medium", energy:"high", personality:"playful" }
  },
  {
    name: "Shiba Inu",
    img: "https://cdn.shopify.com/s/files/1/0813/7945/9311/files/3.jpg?v=1779911250",
    match: { size:"small", energy:"low", personality:"independent" }
  }
];

function start() {
  document.getElementById("intro").classList.remove("active");
  document.getElementById("builder").classList.add("active");
}

document.querySelectorAll(".option").forEach(el => {
  el.addEventListener("click", () => {

    const type = el.parentElement.dataset.type;

    state[type] = el.dataset.value;

    el.parentElement.querySelectorAll(".option")
      .forEach(x => x.classList.remove("active"));

    el.classList.add("active");

    updateResult();
  });
});

function updateResult() {

  let best = dogs[0];
  let bestScore = -1;

  dogs.forEach(dog => {
    let score = 0;

    for (let key in state) {
      if (!state[key]) continue;
      if (dog.match[key] === state[key]) score++;
    }

    if (score > bestScore) {
      bestScore = score;
      best = dog;
    }
  });

  document.getElementById("result").innerHTML = `
    <div class="card">
      <img src="${best.img}">
      <h2>${best.name}</h2>
      <p>Your perfect match updates instantly 🐾</p>
    </div>
  `;
}

</script>

</body>
</html>
